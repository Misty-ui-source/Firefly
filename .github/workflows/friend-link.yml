name: 自动添加友链

on:
  issues:
    types: [opened, labeled]

jobs:
  add-friend-link:
    # 只处理带 "友链申请" 标签的 Issue
    if: contains(github.event.issue.labels.*.name, '友链申请')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: 解析 Issue 并更新配置
        id: parse
        run: |
          # 将 Issue 正文保存到文件
          cat << 'ISSUE_EOF' > /tmp/issue_body.txt
          ${{ github.event.issue.body }}
          ISSUE_EOF
          python3 .github/scripts/add-friend-link.py < /tmp/issue_body.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
      
      - name: 创建 PR
        if: steps.parse.outputs.exit_code == '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: 新增友链 ${{ github.event.issue.title }}"
          title: "feat: 新增友链 - ${{ github.event.issue.title }}"
          body: |
            自动从 Issue #${{ github.event.issue.number }} 添加友链。
            
            请检查友链信息无误后合并。
            
            - Issue: #${{ github.event.issue.number }}
            - 申请者: @${{ github.event.issue.user.login }}
          branch: "friend-link-${{ github.event.issue.number }}"
          delete-branch: true
      
      - name: 评论通知（已存在）
        if: steps.parse.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '该友链已存在，无需重复添加。'
            })
      
      - name: 评论通知（解析失败）
        if: steps.parse.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '友链信息解析失败，请检查 Issue 表单是否填写完整。'
            })
