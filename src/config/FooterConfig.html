<div style="margin-top: 0.25rem;">
	<a class="transition link text-(--primary) font-medium" href="https://icp.gov.moe/?keyword=20260282" target="_blank" rel="noopener"><img src="/moe-icp-icon.png" alt="萌ICP备" style="display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.22em;margin-right:0.3em;" />萌ICP备20260282号</a>
</div>
<div style="margin-top: 0.25rem;" class="text-sm text-50">
	本站已运行 <span id="site-uptime">0 天 0 小时 0 分 0 秒</span>
</div>
<script>
(function () {
	try {
		var start = new Date('2026-10-15T00:00:00+08:00').getTime();
		function tick() {
			var now = Date.now();
			var d = Math.floor((now + 28800000) / 86400000) - Math.floor((start + 28800000) / 86400000) + 1;
			var rest = Math.max(0, now - (Math.floor((now + 28800000) / 86400000) * 86400000 - 28800000));
			var h = Math.floor(rest / 3600000);
			var m = Math.floor((rest % 3600000) / 60000);
			var s = Math.floor((rest % 60000) / 1000);
			var el = document.getElementById('site-uptime');
			if (el) el.textContent = d + ' 天 ' + h + ' 小时 ' + m + ' 分 ' + s + ' 秒';
		}
		tick();
		setInterval(tick, 1000);
	} catch (e) {}
})();
</script>
